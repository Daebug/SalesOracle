<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Oracle</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/allpage.css' %}" />
    <link rel="stylesheet" href="{% static 'css/homepage.css' %}" />
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    
    <style>
        /* Style form fields */
        .inputDatadiv {
            margin-bottom: 20px;
        }
    
        .inputDatadiv label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
    
        .inputDatadiv input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 5px;
            font-size: 16px;
        }
    
        /* Style submit button */
        
        /* Align submit button to right */
        .submit-button-container {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="navbar-nav" style="
        display: flex;
        align-items: center;
        padding: 10px 10px 10px;
        background-color: aliceblue;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
      ">
        <a class="navbar-brand" style="position: absolute; left: 60px" href="{% url 'salesoracle:index' %}">
            <img src="{% static 'images/mlogo.png' %}" alt="LOGO" height="40rem" />
        </a>

        <ul class="navbar-nav" style="display: flex; flex-direction: row; gap: 50px">
            <li class="nav-item" style="font-family: montserrat">
                <a class="nav-link active" aria-current="page" href="{% url 'salesoracle:index' %}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'salesoracle:about' %}">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'salesoracle:contact' %}">Contact</a>
            </li>
        </ul>
    </div>
    
    <div style="
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #7695A7;
      ">
        <div class="pg2Main">
            <div style="display: flex;">

                <div style="width: 100%; height: 87vh; display: flex; align-items: center; justify-content: center;">
                    <div style="width: 100%;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 50px;">
                        
                        <form method="post">
                            {% csrf_token %}
                    
                            <!-- Revenue Field -->
                            <div class="inputDatadiv">
                                <label for="{{ form.revenue.id_for_label }}">Revenue:</label>
                                <br>
                                {{ form.revenue }}
                            </div>
                    
                            <!-- Cost of Goods Sold Field -->
                            <div class="inputDatadiv">
                                <label for="{{ form.cost_of_goods_sold.id_for_label }}">Cost of Goods Sold:</label>
                                <br>
                                {{ form.cost_of_goods_sold }}
                            </div>
                    
                            <!-- Operating Expenses Field -->
                            <div class="inputDatadiv">
                                <label for="{{ form.operating_expenses.id_for_label }}">Operating Expenses:</label>
                                <br>
                                {{ form.operating_expenses }}
                                
                    <!-- <input type="text" class="inputDataResult" name="" id="1"> -->
                            </div>
                            <div style="display: flex; justify-content: end; width: 100%;">
                                <a href="{% url 'salesoracle:loading' %}"><button class="btn btn-primary btn-sm classlabel" type="submit">RESULT</button></a>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- <div style="width: 60%; height: 87vh.2vh; display: grid; place-items: center center;">
                    <div style="width: 60%; height: 65vh;">
                        <div class="classlabel" style="display: flex; justify-content: start; width: 40%; margin-bottom: 10px;">
                            Profit - Percentage = Grand Total
                        </div>

                        <div style="display: flex; justify-content: center; width: 100%; height: 87%;">
                            <input type="text" class="inputData"  name="" id="3" style="width: 80%; height: 97%; font-size: 100px;"> 
                        </div>

                    </div>
                </div> -->

            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.js' %}"></script>
</body>

</html>
